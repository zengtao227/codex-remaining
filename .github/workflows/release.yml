name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run self-tests
        run: bash ./scripts/test.sh

      - name: Build universal release package
        run: bash ./scripts/package-release.sh "$GITHUB_REF_NAME"

      - name: Publish GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Codex Remaining $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
